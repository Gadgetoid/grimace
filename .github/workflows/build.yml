name: Build

on:
  push:
  pull_request:

jobs:
  toolchain:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            llvm: linux-x86_64
          - runner: macos-latest
            llvm: macos-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      GRIMACE_LLVM_RELEASE: v3
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM and CMake
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm cmake

      - name: Download the Windows CE LLVM
        run: |
          name=velo-llvm-$GRIMACE_LLVM_RELEASE-${{ matrix.llvm }}
          url=https://github.com/Gadgetoid/velo-llvm-builds/releases/download/$GRIMACE_LLVM_RELEASE
          curl -fsSLO $url/$name.tar.xz
          curl -fsSLO $url/$name.tar.xz.sha256
          shasum -a 256 -c $name.tar.xz.sha256
          tar xf $name.tar.xz -C "$RUNNER_TEMP"
          for arch in MIPS SH3 ARM; do
            echo "GRIMACE_${arch}_LLVM=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
          done

      - name: Check the docstrings are applied
        run: |
          python3 tools/mkdocs.py
          git diff --exit-code -- include

      - name: Run the checks and build the examples and debugmgr, with no warnings
        run: |
          make check-cxx-headers-mips check-cxx-headers-sh3 check-cxx-headers-arm check-abi check-stdlib check-debugmgr \
            examples-mips-ce1 examples-mips-ce2 examples-sh3-ce1 examples-sh3-ce101 examples-sh3-ce2 examples-arm-ce3 \
            debugmgr-mips-ce1 debugmgr-mips-ce2 debugmgr-sh3-ce1 debugmgr-sh3-ce2 debugmgr-arm-ce3 \
            check-lazy-mips-ce1 check-lazy-mips-ce2 check-lazy-sh3-ce1 check-lazy-sh3-ce101 check-lazy-sh3-ce2 check-lazy-arm-ce3 \
            check-libc-host check-libc-mips-ce1 check-libc-mips-ce2 check-libc-sh3-ce1 check-libc-sh3-ce101 check-libc-sh3-ce2 check-libc-arm-ce3 2>&1 | tee build.log
          ! grep -i "warning:" build.log

      - name: Package the examples
        run: |
          make packages-mips-ce2 packages-arm-ce3
          ls build/mips-ce2/packages build/arm-ce3/packages

      - name: Build the examples pinned to each device, with no warnings
        run: |
          make examples-mips-ce1 examples-mips-ce2 DEVICE=velo1 2>&1 | tee build-devices.log
          make examples-arm-ce3 DEVICE=jornada720 2>&1 | tee -a build-devices.log
          ! grep -i "warning:" build-devices.log

      - name: Check the x86 headers and build the x86 examples, with no warnings
        if: runner.os == 'Linux'
        run: |
          make check-cxx-headers-x86 examples-x86-ce2 check-lazy-x86-ce2 check-libc-x86-ce2 CLANG=clang 2>&1 | tee build-x86.log
          make examples-x86-ce2 DEVICE=joyride 2>&1 | tee -a build-x86.log
          ! grep -i "warning:" build-x86.log

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: examples
          path: |
            build/*-ce*/**/*.exe
            build/*-ce*/**/*.dll
            build/debugmgr/*/*.exe
            build/*/packages/*

  rc-grammar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode/rc-language
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Test the resource script grammar
        run: |
          npm ci
          npm test
